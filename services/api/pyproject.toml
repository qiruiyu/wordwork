[project]
name = "wordwork-api"
# Must match `app.version` in `app/main.py`, which `/healthz` reports. Drifting
# metadata is what let a stale engine sit in a service venv looking healthy.
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
